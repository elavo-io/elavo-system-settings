[package]
name = "elavo-system-settings"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/elavo-io/elavo-system-settings"
default-run = "elavo-system-settings"

[[bin]]
name = "elavo-system-settings"
path = "src/main.rs"

[[bin]]
name = "elavo-system-settings-helper"
path = "src/bin/elavo-system-settings-helper.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
elavo-dock-settings = { git = "https://github.com/elavo-io/elavo-folio", tag = "v0.2.6.3" }
elavo-switcher-settings = { git = "https://github.com/elavo-io/elavo-folio", tag = "v0.2.6.3" }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libpulse-binding = "2"
async-channel = "2"
roxmltree = "0.20"
serde_json = "1"
sha-crypt = "0.5"
libc = "0.2"

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
strip = true
